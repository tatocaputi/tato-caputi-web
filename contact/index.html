  <div id="bg-wrap" class="bg-wrap">
    <img class="bg-image" data-bg-image="fotoContacto" alt="" fetchpriority="high" decoding="async">
    <div class="bg-overlay bg-overlay--contact"></div>
  </div>

  <div id="content-layer" class="content-layer">
    <header class="site-header">
      <a href="/" class="logo logo-el" aria-label="Tato Caputi, inicio">
        <img src="/assets/logos/tato-caputi-logo.png" alt="Tato Caputi" width="700" height="204">
      </a>
      <nav class="top-nav" id="top-nav" aria-label="Navegación principal">
        <a href="/work/" class="top-nav__item" data-text="TRABAJO" data-i18n="nav.work" data-i18n-word="nav.work">Trabajo</a>
        <a href="/about/" class="top-nav__item" data-text="ACERCA" data-i18n="nav.about" data-i18n-word="nav.about">Acerca</a>
        <a href="/contact/" class="top-nav__item" data-text="CONTACTO" data-i18n="nav.contact" data-i18n-word="nav.contact" aria-current="page">Contacto</a>

      </nav>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Menú" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span></button>
    </header>

    <div class="contact-block fade-in">
      <span class="eyebrow" data-i18n="contact.label">Contacto</span>
      <h1 class="contact-title" data-i18n="contact.title">Hablemos.</h1>
      <div class="contact-list">
        <div>
          <span class="contact-label" data-i18n="contact.email.label">Email</span>
          <a href="#" class="contact-big" data-email></a>
        </div>
        <div>
          <span class="contact-label" data-i18n="contact.phone.label">Teléfono</span>
          <a href="#" class="contact-big" data-phone></a>
        </div>
        <div>
          <span class="contact-label" data-i18n="contact.social.label">Redes</span>
          <div class="contact-socials">
            <a href="#" data-link="instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="#" data-link="linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          </div>
        </div>
      </div>
    </div>

    <div class="socials" style="padding-top:1rem">
      <a href="#" data-link="instagram" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg></a>

      <span class="year" style="margin:0 0 0 .25rem" data-i18n="home.year">@2026</span>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu">
    <a href="/work/" class="top-nav__item" data-text="TRABAJO" data-i18n="nav.work" data-i18n-word="nav.work">Trabajo</a>
    <a href="/about/" class="top-nav__item" data-text="ACERCA" data-i18n="nav.about" data-i18n-word="nav.about">Acerca</a>
    <a href="/contact/" class="top-nav__item" data-text="CONTACTO" data-i18n="nav.contact" data-i18n-word="nav.contact" aria-current="page">Contacto</a>
    <button type="button" class="menu-lang" data-lang-toggle data-i18n="lang.toggle">ENG</button>

  <script src="/js/site.js"></script>
